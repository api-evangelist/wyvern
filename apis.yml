apis:
- name: Wyvern Open Data Program STAC Catalog
  description: Public SpatioTemporal Asset Catalog (STAC 1.0.0) for Wyvern's Open Data Program,
    serving free hyperspectral imagery (L2A surface reflectance and L1B radiance) as machine-readable
    JSON catalogs, collections, and items over HTTPS. Browsable via the Wyvern STAC Browser and
    consumable with PySTAC and other STAC tooling. Static catalog - no STAC search API endpoint.
  humanURL: https://opendata.wyvern.space/
  baseURL: https://wyvern-odp.com
