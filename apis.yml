aid: wyvern
name: Wyvern
description: Wyvern is a Canadian space technology company operating the world's first commercial
  hyperspectral satellite constellation. Its Dragonette satellites deliver 31-band VNIR imagery at
  5.3 metre ground sampling distance for agriculture, forestry, energy, mining, and defence use
  cases. Wyvern publishes an Open Data Program of free hyperspectral imagery delivered as a public
  STAC 1.0.0 catalog, alongside a knowledge centre, data product guide, and open notebooks for
  working with its imagery.
